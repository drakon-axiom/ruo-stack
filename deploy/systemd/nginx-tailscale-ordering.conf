# Drop-in: /etc/systemd/system/nginx.service.d/tailscale-ordering.conf
#
# The RUOStack origin server blocks bind 100.99.76.119 (this host's tailscale
# address) explicitly. If nginx starts before tailscaled has brought that
# address up, bind() fails with EADDRNOTAVAIL and nginx refuses to start AT
# ALL -- taking every other site on this box down with it.
#
# Ordering alone still races (tailscaled can be "started" a moment before the
# address is assigned), so retry as well.
[Unit]
After=tailscaled.service
Wants=tailscaled.service

[Service]
Restart=on-failure
RestartSec=3s
