# /etc/nginx/sites-available/ruostack.conf
# RUOStack reverse proxy. Three hosts:
#   ruostack.com          -> static landing / info site
#   app.ruostack.io       -> customer (brand) portal  [brand-web SPA] + API
#   backend.ruostack.io   -> admin portal              [admin-web SPA] + API + admin auth
#
# The Fastify API (both realms + every webhook) listens on 127.0.0.1:3901 and is
# proxied under /api/ (+ /auth/ for admin) on each portal host, so the browser
# talks SAME-ORIGIN — no CORS, no mixed content. All plaintext (:80) for now;
# run certbot afterwards to add TLS (see the footer of this file).

upstream ruostack_api {
    server 127.0.0.1:3901;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────────────────────
# Landing / info — ruostack.com (+ www)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ruostack.com www.ruostack.com;

    # Certbot HTTP-01 challenge (used by --webroot; --nginx handles its own).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /var/www/ruostack.com/html;   # drop your marketing/info site here
    index index.html;

    location / { try_files $uri $uri/ =404; }
}

# ─────────────────────────────────────────────────────────────────────────────
# Customer portal — app.ruostack.io  (brand-web + brand API)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.ruostack.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /var/www/app.ruostack.io/html;   # brand-web `dist` (see BUILD notes)
    index index.html;

    client_max_body_size 2m;              # base64 logo upload (~1 MB) + headroom

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy defaults inherited by the /api + /healthz locations below. req.ip in
    # the API relies on these (trustProxy) for audit logging + rate limiting.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    # Brand API + fulfillment webhooks (all under /api on the shared API).
    location /api/    { proxy_pass http://ruostack_api; }
    location = /healthz { proxy_pass http://ruostack_api; }

    # Hashed build assets are immutable; the HTML shell must never be cached.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-store"; }

    # SPA fallback — client-side router owns the rest.
    location / { try_files $uri $uri/ /index.html; }
}

# ─────────────────────────────────────────────────────────────────────────────
# Admin portal — backend.ruostack.io  (admin-web + admin API + admin auth)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name backend.ruostack.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    root /var/www/backend.ruostack.io/html;   # admin-web `dist`
    index index.html;

    client_max_body_size 2m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Optional hardening for the operator surface — uncomment to allowlist office
    # / VPN IPs (deny everyone else). Leave the API proxy reachable for webhooks
    # only if you register webhooks against app.ruostack.io instead (see NOTES).
    # allow 203.0.113.0/24;
    # deny  all;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;

    location /api/      { proxy_pass http://ruostack_api; }
    location /auth/     { proxy_pass http://ruostack_api; }   # admin login / refresh / mfa
    location = /healthz { proxy_pass http://ruostack_api; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-store"; }

    location / { try_files $uri $uri/ /index.html; }
}

# ─────────────────────────────────────────────────────────────────────────────
# TLS with certbot
#   sudo mkdir -p /var/www/certbot
#   sudo ln -s /etc/nginx/sites-available/ruostack.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx \
#     -d ruostack.com -d www.ruostack.com \
#     -d app.ruostack.io -d backend.ruostack.io
# certbot --nginx rewrites each server block: adds a listen 443 ssl block, the
# ssl_certificate paths, and an http->https redirect. Renewal is automatic.
# ─────────────────────────────────────────────────────────────────────────────
