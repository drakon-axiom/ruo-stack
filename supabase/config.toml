# Supabase local config. `project_id` is set on `supabase link`.
project_id = "ruo-stack"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge functions. Webhooks must skip JWT verification (Stripe signs instead).
[functions.stripe-webhook]
verify_jwt = false

[functions.create-wallet-checkout]
verify_jwt = true

[functions.create-manual-order]
verify_jwt = true

[functions.shipstation-buy-label]
verify_jwt = true

[functions.process-awaiting-funds]
verify_jwt = true

[functions.admin-api]
verify_jwt = true

[functions.woo-sync]
verify_jwt = true
